version: '3.8'

services:
  app:
    build: .
    container_name: savegift-app
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - savegift-network

  db:
    image: mysql:8.0
    container_name: savegift-db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root12345
      MYSQL_DATABASE: save_gift
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - savegift-network

networks:
  savegift-network:
    driver: bridge

volumes:
  mysql-data:
